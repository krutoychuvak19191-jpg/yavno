<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yawno | Neural Gesture Interface</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Inter:wght@300;400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4385C7;     /* Ваш синий */
            --accent: #D96640;      /* Ваш оранжевый */
            --bg-dark: #070a12;
            --text-main: #ffffff;
            --text-muted: #8da4c4;
            --success: #10B981;
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        /* --- Переливающийся анимированный фон --- */
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Убираем скролл, чтобы фон не дергался */
            position: relative;
        }

        /* Светящиеся сферы на фоне */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-blue {
            width: 500px; height: 500px;
            background: var(--primary);
            top: -100px; left: -100px;
        }
        .orb-orange {
            width: 400px; height: 400px;
            background: var(--accent);
            bottom: -50px; right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* --- Шапка --- */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
            z-index: 10;
        }

        .logo {
            font-family: 'Irish Grover', cursive;
            font-size: 56px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(217, 102, 64, 0.5));
            margin: 0;
            letter-spacing: 2px;
            animation: pulse-logo 3s infinite alternate;
        }

        @keyframes pulse-logo {
            0% { filter: drop-shadow(0 0 10px rgba(67, 133, 199, 0.4)); }
            100% { filter: drop-shadow(0 0 20px rgba(217, 102, 64, 0.6)); }
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
        }

        /* --- Стеклянная карточка задания --- */
        .task-card {
            width: 100%;
            max-width: 900px;
            background: rgba(25, 35, 55, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(67, 133, 199, 0.1);
            z-index: 10;
            position: relative;
            overflow: hidden;
        }

        /* Переливающаяся полоска сверху карточки */
        .task-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
            background-size: 200% 100%;
            animation: gradient-move 3s linear infinite;
        }

        @keyframes gradient-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-badge {
            background: linear-gradient(135deg, var(--primary), #2a649e);
            color: white;
            font-weight: 800;
            font-size: 15px;
            padding: 10px 20px;
            border-radius: 12px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(67, 133, 199, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .task-name {
            font-size: 30px;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .task-hint {
            font-size: 16px;
            color: var(--text-muted);
        }

        /* --- Контейнер с камерой --- */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid transparent;
            background-clip: padding-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        /* Светящаяся рамка вокруг камеры */
        .camera-container::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--accent), var(--primary));
            z-index: -1;
            border-radius: 26px;
            background-size: 200% 200%;
            animation: border-glow 4s linear infinite;
        }

        @keyframes border-glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркальное отражение */
        }

        canvas { z-index: 10; }

        /* --- Загрузка --- */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(67, 133, 199, 0.2);
            border-top-color: var(--accent);
            border-bottom-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(217, 102, 64, 0.3);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- Статус и кнопки --- */
        .status-message {
            font-size: 26px;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            min-height: 45px;
            margin: 20px 0;
            text-align: center;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        /* Оранжевая кнопка (Пропустить) */
        .btn-skip {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(217, 102, 64, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .btn-skip:hover {
            background: #e6734d;
            box-shadow: 0 0 30px rgba(217, 102, 64, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px) scale(1.02);
        }

        /* Синяя кнопка (Заново) */
        .btn-restart {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 20px rgba(67, 133, 199, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .btn-restart:hover {
            background: #529ae0;
            box-shadow: 0 0 30px rgba(67, 133, 199, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px) scale(1.02);
        }

        .hidden { display: none !important; }

        /* --- Адаптивность --- */
        @media (max-width: 768px) {
            .task-card { flex-direction: column; align-items: flex-start; gap: 15px; }
            .logo { font-size: 44px; }
            header { flex-direction: column; gap: 5px; }
            .task-name { font-size: 24px; }
            .controls { width: 100%; flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Фоновые переливающиеся сферы -->
    <div class="bg-orb orb-blue"></div>
    <div class="bg-orb orb-orange"></div>

    <header>
        <h1 class="logo">Yawno</h1>
        <span class="subtitle">Neural Gesture Interface</span>
    </header>

    <div class="task-card">
        <div class="task-info">
            <div class="progress-badge" id="progress">1 / 5</div>
            <div>
                <div class="task-name" id="task-name">Загрузка...</div>
                <div class="task-hint" id="task-hint">Подготовка нейросети...</div>
            </div>
        </div>
    </div>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div style="font-weight: 600; letter-spacing: 2px;">ИНИЦИАЛИЗАЦИЯ ИИ...</div>
        </div>
    </div>

    <div class="status-message" id="status"></div>

    <div class="controls">
        <button class="btn-skip" id="btn-skip" onclick="skipGesture()">Пропустить ⏭</button>
        <button class="btn-restart hidden" id="btn-restart" onclick="restartGame()">Начать заново 🔄</button>
    </div>

    <!-- Подключение MediaPipe Tasks Vision -->
    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        // --- Конфигурация жестов ---
        const GESTURES_DB = {
            "ДА (Класс)": [1, 0, 0, 0, 0],
            "НЕТ": [0, 1, 0, 0, 0],
            "ПРИВЕТ": [1, 1, 1, 1, 1],
            "ЛЮБЛЮ": [1, 1, 0, 0, 1],
            "ПОКА": [0, 1, 1, 1, 1]
        };

        const HINTS = {
            "ДА (Класс)": "Поднимите большой палец вверх",
            "НЕТ": "Поднимите только указательный палец",
            "ПРИВЕТ": "Покажите открытую ладонь",
            "ЛЮБЛЮ": "Большой, указательный и мизинец",
            "ПОКА": "Ладонь без большого пальца"
        };

        const gestureList = Object.keys(GESTURES_DB);
        let currentIndex = 0;
        let currentTarget = gestureList[currentIndex];
        
        let startTime = Date.now();
        let isCountingDown = false;
        let countdownStart = 0;
        let isFinished = false;

        // DOM Elements
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const loadingOverlay = document.getElementById('loading');
        const taskNameEl = document.getElementById('task-name');
        const taskHintEl = document.getElementById('task-hint');
        const progressEl = document.getElementById('progress');
        const statusEl = document.getElementById('status');
        const btnSkip = document.getElementById('btn-skip');
        const btnRestart = document.getElementById('btn-restart');

        // --- Инициализация MediaPipe ---
        let handLandmarker;
        let lastVideoTime = -1;

        async function init() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });

            navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
                .then(stream => {
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.classList.add('hidden'), 500);
                    updateUI();
                })
                .catch(err => {
                    loadingOverlay.innerHTML = "<div style='color:#EF4444; font-weight:bold;'>ОШИБКА ДОСТУПА К КАМЕРЕ</div>";
                    console.error(err);
                });
        }

        function getFingerStates(landmarks) {
            const fingers = [];
            const thumbTip = landmarks[4];
            const thumbIp = landmarks[3];
            const indexMcp = landmarks[5];
            
            const distTip = Math.hypot(thumbTip.x - indexMcp.x, thumbTip.y - indexMcp.y);
            const distIp = Math.hypot(thumbIp.x - indexMcp.x, thumbIp.y - indexMcp.y);
            fingers.push(distTip > distIp * 1.2 ? 1 : 0);

            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            for (let i = 0; i < 4; i++) {
                fingers.push(landmarks[tips[i]].y < landmarks[pips[i]].y ? 1 : 0);
            }
            return fingers;
        }

        function calculateAccuracy(userFingers, targetFingers) {
            let matches = 0;
            for (let i = 0; i < 5; i++) {
                if (userFingers[i] === targetFingers[i]) matches++;
            }
            return Math.floor((matches / 5) * 100);
        }

        function predictWebcam() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = handLandmarker.detectForVideo(video, startTimeMs);
                processResults(results);
            }
            window.requestAnimationFrame(predictWebcam);
        }

        function processResults(results) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let userFingers = null;

            if (results.landmarks && results.landmarks.length > 0) {
                for (const landmarks of results.landmarks) {
                    for (const lm of landmarks) {
                        const x = lm.x * canvas.width;
                        const y = lm.y * canvas.height;
                        
                        // Переливающиеся точки на руке
                        ctx.beginPath();
                        ctx.arc(x, y, 8, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(217, 102, 64, 0.4)'; // Оранжевое свечение
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2 * Math.PI);
                        ctx.fillStyle = '#4385C7'; // Синий центр
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 2, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                    }
                    userFingers = getFingerStates(landmarks);
                }
            }

            if (!isFinished) {
                if (isCountingDown) {
                    const elapsed = (Date.now() - countdownStart) / 1000;
                    const remaining = 3.0 - elapsed;
                    
                    if (remaining > 0) {
                        statusEl.textContent = `✅ ВЕРНО! Ждём... ${Math.floor(remaining) + 1}`;
                        statusEl.style.color = '#10B981';
                        statusEl.style.textShadow = '0 0 20px rgba(16, 185, 129, 0.6)';
                    } else {
                        isCountingDown = false;
                        nextGesture();
                    }
                } 
                else if (userFingers) {
                    const targetFingers = GESTURES_DB[currentTarget];
                    const accuracy = calculateAccuracy(userFingers, targetFingers);

                    if (accuracy >= 80) {
                        if ((Date.now() - startTime) / 1000 > 1.0) {
                            isCountingDown = true;
                            countdownStart = Date.now();
                            statusEl.textContent = "✅ ВЕРНО! Ждём... 3";
                            statusEl.style.color = '#10B981';
                            statusEl.style.textShadow = '0 0 20px rgba(16, 185, 129, 0.6)';
                        }
                    } else {
                        statusEl.textContent = `❌ Мимо... ${accuracy}%`;
                        statusEl.style.color = '#EF4444';
                        statusEl.style.textShadow = '0 0 20px rgba(239, 68, 68, 0.6)';
                        startTime = Date.now();
                    }
                } 
                else {
                    if (!isCountingDown) {
                        startTime = Date.now();
                        statusEl.textContent = "";
                    }
                }
            }
        }

        function updateUI() {
            if (isFinished) {
                progressEl.textContent = "ГОТОВО";
                taskNameEl.textContent = "🎉 ТРЕНИРОВКА ЗАВЕРШЕНА! 🎉";
                taskHintEl.textContent = "Вы отлично справились!";
                btnSkip.classList.add('hidden');
                btnRestart.classList.remove('hidden');
            } else {
                progressEl.textContent = `${currentIndex + 1} / ${gestureList.length}`;
                taskNameEl.textContent = currentTarget;
                taskHintEl.textContent = HINTS[currentTarget];
            }
        }

        function nextGesture() {
            if (isFinished) return;
            currentIndex++;
            if (currentIndex >= gestureList.length) {
                finishGame();
                return;
            }
            currentTarget = gestureList[currentIndex];
            startTime = Date.now();
            statusEl.textContent = "";
            isCountingDown = false;
            updateUI();
        }

        function skipGesture() {
            nextGesture();
        }

        function finishGame() {
            isFinished = true;
            isCountingDown = false;
            statusEl.textContent = "🎉 ТРЕНИРОВКА ЗАВЕРШЕНА! 🎉";
            statusEl.style.color = '#D96640'; // Оранжевый для финала
            statusEl.style.textShadow = '0 0 30px rgba(217, 102, 64, 0.8)';
            updateUI();
        }

        function restartGame() {
            isFinished = false;
            currentIndex = 0;
            currentTarget = gestureList[0];
            startTime = Date.now();
            isCountingDown = false;
            statusEl.textContent = "";
            btnSkip.classList.remove('hidden');
            btnRestart.classList.add('hidden');
            updateUI();
        }

        init();
    </script>
</body>
</html>
